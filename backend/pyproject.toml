[project]
name = "marketradar"
version = "0.1.0"
description = "Agentic competitive intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "slowapi>=0.1.9",
    "redis>=5.2",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "celery[redis]>=5.4",
    "httpx>=0.28",
    "playwright>=1.49",
    "trafilatura>=2.0",
    "selectolax>=0.3.26",
    "feedparser>=6.0.11",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.8",
    "ollama>=0.4.4",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "minio>=7.2",
    "sse-starlette>=2.1",
    "markdown>=3.7",
    "tenacity>=9.0",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-markdown",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "E501", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
# LangGraph's add_node overloads require TypedDict-annotated node signatures; our traced nodes take the
# state generically, which LangGraph accepts at runtime.
module = ["app.agents.graph", "app.agents.brief_graph"]
disable_error_code = ["call-overload"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires Docker (testcontainers)"]
