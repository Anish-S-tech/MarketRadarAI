# One virtual host per fictional company: acme / globex / initech / newswire .localtest.me:8090
server {
    listen 8090 default_server;
    server_name ~^(?<site>[a-z]+)\.localtest\.me$;
    root /usr/share/nginx/html/$site;
    index index.html;
    etag on;
    location / { try_files $uri $uri/index.html =404; }
    location = /robots.txt { return 200 "User-agent: *\nAllow: /\n"; add_header Content-Type text/plain; }
}
