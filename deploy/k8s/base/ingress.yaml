apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketradar
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE alert stream
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [marketradar.example.com]
      secretName: marketradar-tls
  rules:
    - host: marketradar.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
