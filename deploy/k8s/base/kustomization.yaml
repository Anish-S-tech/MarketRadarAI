apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marketradar
labels:
  - pairs:
      app.kubernetes.io/part-of: marketradar
resources:
  - namespace.yaml
  - config.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - beat.yaml
  - frontend.yaml
  - ingress.yaml
images:
  - name: marketradar-api
    newName: ghcr.io/your-org/marketradar-api
    newTag: latest
  - name: marketradar-worker
    newName: ghcr.io/your-org/marketradar-worker
    newTag: latest
  - name: marketradar-frontend
    newName: ghcr.io/your-org/marketradar-frontend
    newTag: latest
