apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: { kind: Deployment, name: "api|worker|frontend" }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: { kind: ConfigMap, name: marketradar-config }
    patch: |-
      - op: replace
        path: /data/ENV
        value: dev
      - op: replace
        path: /data/ALLOW_SIGNUP
        value: "true"
