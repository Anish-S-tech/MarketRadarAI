# Minimal SearXNG config for machine use by the Research Agent (JSON API enabled, limiter off).
use_default_settings: true
general:
  instance_name: "marketradar-search"
server:
  secret_key: "change-me-marketradar-searxng"
  limiter: false
  image_proxy: false
search:
  safe_search: 0
  formats:
    - html
    - json
ui:
  static_use_hash: true
